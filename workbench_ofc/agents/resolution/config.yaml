agent:
  id: resolution
  display_name: Resolution Agent
  version: "1.0.0"
  kind: lifecycle
  stage: resolve
model:
  provider: azure_openai
  name: gpt-4.1
  temperature: 0.1
  max_tokens: 3000
runtime:
  max_turns: 14
  require_hitl_before_execute: true
subagents:
  - runbook_recommendation
  - self_healing
  - automation_execution
connectors:
  - cognitive_bridge
  - rundeck
  - ansible
  - azure_automation
  - servicenow
tools:
  - recommend_runbook
  - propose_self_heal
  - execute_automation
  - request_recovery_approval
